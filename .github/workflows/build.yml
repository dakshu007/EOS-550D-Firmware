name: Build LUMEN

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-550d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            python3 python3-docutils make zip lua5.3

      - name: Check and test LUMEN scripts
        run: |
          v="$(cat lumen/VERSION)"
          grep -q "#define LUMEN_VERSION \"$v\"" lumen/patches/0001-lumen-theme.patch \
            || { echo "LUMEN_VERSION in the patch does not match lumen/VERSION ($v)"; exit 1; }
          for f in lumen/scripts/*.lua; do luac5.3 -p "$f"; done
          lua5.3 lumen/tests/test.lua lumen/scripts lumen/tests

      - name: Build LUMEN for EOS 550D (fw 1.0.9)
        run: ./build.sh

      - name: Upload card files
        uses: actions/upload-artifact@v4
        with:
          name: LUMEN-550D.109
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
